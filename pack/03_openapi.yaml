components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 25
    Sort:
      name: sort
      in: query
      description: comma list, prefix - for desc
      schema: *id003
    Search:
      name: search
      in: query
      schema: *id003
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - ar
        - en
        default: ar
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      description: RowVersion (base64) for optimistic concurrency
      schema: *id003
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: No permission or outside data scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict (overlap, RowVersion mismatch)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unprocessable:
      description: Business rule violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Company:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          maxLength: 20
        nameAr: &id005
          type: string
          maxLength: 200
        nameEn: &id006
          type: string
          maxLength: 200
          nullable: true
        logoAttachmentId: &id007
          type: integer
          format: int64
          nullable: true
        timeZone: &id008
          type: string
          maxLength: 50
        currencyCode: &id009
          type: string
          maxLength: 10
        defaultLanguage: &id010
          type: string
          maxLength: 5
        hijriAdjustDays: &id011
          type: integer
          format: int32
        isActive: &id012
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: integer
          format: int64
          nullable: true
        rowVersion:
          type: string
          format: byte
          readOnly: true
    CompanyInput:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: auto-assigned when omitted
        nameAr: *id005
        nameEn: *id006
        logoAttachmentId: *id007
        timeZone: *id008
        currencyCode: *id009
        defaultLanguage: *id010
        hijriAdjustDays: *id011
        isActive: *id012
      required:
      - nameAr
    FiscalYear:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
          description: FK -> Companies.Id
        fiscalYear: &id013
          type: integer
          format: int32
        startDate: &id014
          type: string
          format: date
        endDate: &id015
          type: string
          format: date
        isClosed: &id016
          type: boolean
        isCurrent: &id017
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: integer
          format: int64
          nullable: true
        rowVersion:
          type: string
          format: byte
          readOnly: true
    FiscalYearInput:
      type: object
      properties:
        fiscalYear: *id013
        startDate: *id014
        endDate: *id015
        isClosed: *id016
        isCurrent: *id017
      required:
      - fiscalYear
      - startDate
      - endDate
    UserGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
          description: FK -> Companies.Id
        code:
          type: integer
          format: int32
        nameAr: &id018
          type: string
          maxLength: 200
        nameEn: &id019
          type: string
          maxLength: 200
          nullable: true
        notes: &id020
          type: string
          maxLength: 1000
          nullable: true
        isActive: &id021
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: integer
          format: int64
          nullable: true
        rowVersion:
          type: string
          format: byte
          readOnly: true
    UserGroupInput:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: auto-assigned when omitted
        nameAr: *id018
        nameEn: *id019
        notes: *id020
        isActive: *id021
      required:
      - nameAr
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
          description: FK -> Companies.Id
        code:
          type: integer
          format: int32
        nameAr: &id022
          type: string
          maxLength: 200
        nameEn: &id023
          type: string
          maxLength: 200
          nullable: true
        notes: &id024
          type: string
          maxLength: 1000
          nullable: true
        isActive: &id025
