openapi: 3.0.3
info:
  title: HRMS API
  version: 1.0.0
  description: 'HR, attendance and payroll API. Companion to the HRMS spec document (sections 8-10) and 01_schema.sql. Schemas are generated from the SQL schema;
    business rules live in the spec.

    جميع التواريخ ISO 8601، والأخطاء بصيغة RFC 7807، والتعديل بـ If-Match، وإنشاء العمليات الحساسة بـ Idempotency-Key.'
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost:5001
security:
- bearerAuth: []
tags:
- name: Admin
- name: Attendance
- name: Auth
- name: Dashboard
- name: Definitions
- name: Employees
- name: Finance
- name: Leaves
- name: Mobile
- name: Reports
- name: Requests
- name: Self service
- name: Tasks
paths:
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Login
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: Rotate refresh token
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke refresh token
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/change-password:
    post:
      tags:
      - Auth
      operationId: changePassword
      summary: Change own password
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
